# Security updates only. `open-pull-requests-limit: 0` turns the weekly version updates off: the project pins every
# version by hand, to releases at least two weeks old (CLAUDE.md). Security updates do not count against that limit, so
# a known vulnerability still opens one grouped pull request per folder. They need "Dependabot security updates" on
# in the repository's settings (Settings → Advanced Security).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # The tutor agent (agent/requirements.txt).
  - package-ecosystem: pip
    directory: /agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # The actions CI itself runs (.github/workflows).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
