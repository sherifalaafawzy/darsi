<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f2" />
    <!-- Light only: browsers that darken pages by themselves (Samsung Internet, Chrome's auto dark) leave it alone. -->
    <meta name="color-scheme" content="only light" />
    <meta name="description" content="Practical training in AI, programming, data, IoT and cyber security for teachers and their students: short lessons and classroom kits in English and Arabic, even offline." />
    <!-- Link previews (WhatsApp, an invite link, social posts): the same words, and the app icon. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Darsi — درسي" />
    <meta property="og:title" content="Darsi — درسي" />
    <meta property="og:description" content="Practical training in AI, programming, data, IoT and cyber security for teachers and their students: short lessons and classroom kits in English and Arabic, even offline." />
    <meta property="og:image" content="https://darsiai.org/app-icons/app-icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Darsi" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/app-icons/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Darsi — درسي</title>
    <!-- The page's only script of our own besides the app: the redirect from the Hosting site's own addresses, the
         service worker's registration (the build adds data-sw) and the "update your browser" card's timer. A file,
         not inline code, so a Content-Security-Policy without 'unsafe-inline' allows it. Keep the tag exactly so:
         vite.config.ts ("darsi-early-sw") looks for it. -->
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown only if the app has not mounted after 15 seconds (a browser too old to run even the legacy build);
         /boot.js decides. System fonts, light colours: this has to paint when the bundles and the web fonts do not. -->
    <div id="boot-fallback" hidden>
      <div class="boot-fallback-card">
        <h1 lang="en">Please update your browser</h1>
        <p lang="en">Darsi needs a newer version of Chrome, or another browser.</p>
        <h1 lang="ar" dir="rtl">من فضلك حدّث المتصفح</h1>
        <p lang="ar" dir="rtl">يحتاج «درسي» إلى إصدار أحدث من Chrome، أو إلى متصفح آخر.</p>
      </div>
    </div>
    <noscript>Darsi needs JavaScript to run. <span lang="ar" dir="rtl">يحتاج «درسي» إلى JavaScript ليعمل.</span></noscript>
    <style>
      #boot-fallback { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 2; box-sizing: border-box; margin: 0; padding: 32px 20px; overflow: auto; background: #f2f2f2; color: #1e1a33; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; font-size: 18px; line-height: 1.5; }
      #boot-fallback[hidden] { display: none; }
      .boot-fallback-card { max-width: 28em; margin: 10vh auto 0; }
      #boot-fallback h1 { margin: 16px 0 8px; font-size: 22px; line-height: 1.3; color: #b43c0a; }
      #boot-fallback p { margin: 0 0 8px; }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
